<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Clase de Cortesía</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #FFD500;
    min-height: 100vh;
    padding: 20px;
  }

  .lock-screen {
    min-height: calc(100vh - 40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lock-card {
    background: #FFFFFF;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }

  .lock-card .icon {
    width: 64px;
    height: 64px;
    background: #FFD500;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
  }

  .lock-card h1 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #111111;
  }

  #usernameInput,
  #passwordInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 2px solid #111111;
    border-radius: 8px;
    outline: none;
    margin-bottom: 14px;
  }

  .password-wrap {
    position: relative;
  }

  .password-wrap input {
    padding-right: 46px;
  }

  .toggle-password {
    position: absolute;
    right: 10px;
    top: 0;
    bottom: 14px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    width: 32px;
    padding: 0;
    cursor: pointer;
    color: #555555;
  }

  .toggle-password:hover {
    color: #111111;
  }

  .toggle-password svg {
    width: 22px;
    height: 22px;
  }

  button {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background: #111111;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:disabled {
    background: #555555;
    cursor: default;
  }

  .error {
    color: #B00020;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .error.visible { display: block; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="icon">🔒</div>
      <h1>Panel de Administración</h1>
      <form id="lockForm">
        <input type="email" id="usernameInput" placeholder="Usuario" autocomplete="username" required>
        <div class="password-wrap">
          <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" id="unlockButton">Iniciar sesión</button>
        <div class="error" id="lockError">Usuario o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://czrlkgnoexrvhssepely.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A8BB12yl_8s7zvvGVsEOIA_BdZFnD1W';
  const SESSION_KEY = 'adminPanelAuth';
  const PARTICIPANTES_URL = '/participantes';

  const lockForm = document.getElementById('lockForm');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');
  const togglePassword = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');
  const unlockButton = document.getElementById('unlockButton');
  const lockError = document.getElementById('lockError');

  const EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>';
  const EYE_CLOSED = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle><line x1="2" y1="22" x2="22" y2="2"></line>';

  togglePassword.addEventListener('click', function () {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
    togglePassword.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });

  async function fetchParticipantes(username, password) {
    const response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_participantes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ p_username: username, p_password: password })
    });

    if (!response.ok) {
      throw new Error('unauthorized');
    }

    return response.json();
  }

  lockForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    lockError.classList.remove('visible');
    unlockButton.disabled = true;
    unlockButton.textContent = 'Verificando...';

    try {
      await fetchParticipantes(username, password);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username, password }));
      window.location.href = PARTICIPANTES_URL;
    } catch (err) {
      lockError.classList.add('visible');
      unlockButton.disabled = false;
      unlockButton.textContent = 'Iniciar sesión';
    }
  });

  (async function tryAutoLogin() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (!saved) return;

    try {
      const { username, password } = JSON.parse(saved);
      await fetchParticipantes(username, password);
      window.location.href = PARTICIPANTES_URL;
    } catch (err) {
      sessionStorage.removeItem(SESSION_KEY);
    }
  })();
</script>

</body>
</html>
