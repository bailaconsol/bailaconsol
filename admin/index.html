<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Clase de Cortesía</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #FFD500;
    min-height: 100vh;
    padding: 20px;
  }

  .lock-screen {
    min-height: calc(100vh - 40px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lock-card {
    background: #FFFFFF;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }

  .lock-card .icon {
    width: 64px;
    height: 64px;
    background: #FFD500;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
  }

  .lock-card h1 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #111111;
  }

  #usernameInput,
  #passwordInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 2px solid #111111;
    border-radius: 8px;
    outline: none;
    margin-bottom: 14px;
  }

  .password-wrap {
    position: relative;
  }

  .password-wrap input {
    padding-right: 46px;
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    margin-top: -7px;
    background: none;
    border: none;
    width: auto;
    padding: 4px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #555555;
  }

  .toggle-password:hover {
    color: #111111;
  }

  .logout-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .logout-button {
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    background: #FFFFFF;
    color: #111111;
    border: 2px solid #111111;
  }

  .logout-button:hover {
    background: #111111;
    color: #FFFFFF;
  }

  button {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background: #111111;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  button:disabled {
    background: #555555;
    cursor: default;
  }

  .error {
    color: #B00020;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .error.visible { display: block; }

  .dashboard {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  .dashboard h1 {
    color: #111111;
    font-size: 24px;
    margin-bottom: 6px;
  }

  .dashboard .summary {
    color: #333333;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .table-wrap {
    background: #FFFFFF;
    border-radius: 16px;
    overflow-x: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: auto;
  }

  th, td {
    padding: 14px 18px;
    text-align: left;
    font-size: 14px;
  }

  td {
    white-space: nowrap;
  }

  th {
    white-space: normal;
  }

  thead th {
    background: #111111;
    color: #FFFFFF;
    position: sticky;
    top: 0;
  }

  tbody tr:nth-child(even) {
    background: #FAFAFA;
  }

  tbody tr:hover {
    background: #FFF7D6;
  }

  .si {
    color: #1DA851;
    font-weight: 700;
  }

  .attempts-flag {
    color: #E00000;
    font-weight: 700;
  }

  .empty-name {
    color: #999999;
  }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: #666666;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="icon">🔒</div>
      <h1>Panel de Administración</h1>
      <form id="lockForm">
        <input type="email" id="usernameInput" placeholder="Usuario" autocomplete="username" required>
        <div class="password-wrap">
          <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">👁️</button>
        </div>
        <button type="submit" id="unlockButton">Iniciar sesión</button>
        <div class="error" id="lockError">Usuario o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

  <div class="dashboard" id="dashboard" hidden>
    <div class="logout-bar">
      <button type="button" class="logout-button" id="logoutButton">Cerrar sesión</button>
    </div>
    <h1>Participantes de la Clase de Cortesía</h1>
    <p class="summary" id="summaryText"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Número</th>
            <th>Nombre (Opcional)</th>
            <th>Email</th>
            <th>Fecha que probó la Clase</th>
            <th>Probó Clase Cortesía</th>
            <th>Veces que probó</th>
            <th>Cantidad de veces que intentó</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" hidden>Todavía no hay participantes registrados.</div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://czrlkgnoexrvhssepely.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A8BB12yl_8s7zvvGVsEOIA_BdZFnD1W';

  const SESSION_KEY = 'adminPanelAuth';

  const lockScreen = document.getElementById('lockScreen');
  const lockForm = document.getElementById('lockForm');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');
  const togglePassword = document.getElementById('togglePassword');
  const unlockButton = document.getElementById('unlockButton');
  const lockError = document.getElementById('lockError');
  const dashboard = document.getElementById('dashboard');
  const tableBody = document.getElementById('tableBody');
  const summaryText = document.getElementById('summaryText');
  const emptyState = document.getElementById('emptyState');
  const logoutButton = document.getElementById('logoutButton');

  togglePassword.addEventListener('click', function () {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    togglePassword.textContent = showing ? '👁️' : '🙈';
    togglePassword.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });

  function formatFecha(iso) {
    const d = new Date(iso);
    return d.toLocaleString('es-CO', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function renderRows(rows) {
    tableBody.innerHTML = '';
    if (!rows.length) {
      emptyState.hidden = false;
      summaryText.textContent = 'Todavía no hay participantes registrados.';
      return;
    }
    emptyState.hidden = true;

    rows.forEach((row, index) => {
      const tr = document.createElement('tr');

      const nameCell = row.name
        ? row.name
        : '<span class="empty-name">—</span>';

      const attemptsCell = row.attempts > 1
        ? '<span class="attempts-flag">' + row.attempts + '</span>'
        : row.attempts;

      tr.innerHTML =
        '<td>' + (index + 1) + '</td>' +
        '<td>' + nameCell + '</td>' +
        '<td>' + row.email + '</td>' +
        '<td>' + formatFecha(row.used_at) + '</td>' +
        '<td class="si">SI</td>' +
        '<td>1</td>' +
        '<td>' + attemptsCell + '</td>';

      tableBody.appendChild(tr);
    });

    summaryText.textContent = rows.length === 1
      ? '1 persona ha probado la clase de cortesía.'
      : rows.length + ' personas han probado la clase de cortesía.';
  }

  async function fetchParticipantes(username, password) {
    const response = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_participantes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ p_username: username, p_password: password })
    });

    if (!response.ok) {
      throw new Error('unauthorized');
    }

    return response.json();
  }

  lockForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    lockError.classList.remove('visible');
    unlockButton.disabled = true;
    unlockButton.textContent = 'Verificando...';

    try {
      const rows = await fetchParticipantes(username, password);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username, password }));
      lockScreen.hidden = true;
      dashboard.hidden = false;
      renderRows(rows);
    } catch (err) {
      lockError.classList.add('visible');
      unlockButton.disabled = false;
      unlockButton.textContent = 'Iniciar sesión';
    }
  });

  logoutButton.addEventListener('click', function () {
    sessionStorage.removeItem(SESSION_KEY);
    dashboard.hidden = true;
    lockScreen.hidden = false;
    usernameInput.value = '';
    passwordInput.value = '';
  });

  (async function tryAutoLogin() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (!saved) return;

    try {
      const { username, password } = JSON.parse(saved);
      const rows = await fetchParticipantes(username, password);
      lockScreen.hidden = true;
      dashboard.hidden = false;
      renderRows(rows);
    } catch (err) {
      sessionStorage.removeItem(SESSION_KEY);
    }
  })();
</script>

</body>
</html>
