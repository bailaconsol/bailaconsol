<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación - Clase de Cortesía</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #FFD500;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #FFFFFF;
    border-radius: 16px;
    max-width: 480px;
    width: 100%;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }

  .icon {
    width: 64px;
    height: 64px;
    background: #FFD500;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 32px;
  }

  h1 {
    color: #111111;
    font-size: 24px;
    line-height: 1.35;
    margin-bottom: 16px;
  }

  p.subtitle {
    color: #333333;
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .badge-atencion {
    display: inline-block;
    background: #E00000;
    color: #FFFFFF;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-right: 6px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  input[type="email"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 2px solid #111111;
    border-radius: 8px;
    outline: none;
    color: #111111;
    background: #FFFFFF;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="email"]::placeholder {
    color: #999999;
  }

  input[type="email"]:focus {
    border-color: #111111;
    box-shadow: 0 0 0 3px rgba(255, 213, 0, 0.5);
  }

  button {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background: #111111;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:hover {
    background: #2b2b2b;
  }

  button:active {
    transform: scale(0.98);
  }

  .error {
    color: #B00020;
    font-size: 13px;
    text-align: left;
    display: none;
  }

  .error.visible {
    display: block;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">💃</div>
    <h1>Accede a la Clase de Cortesía de Bachata Femenina en vivo</h1>
    <p class="subtitle"><span class="badge-atencion">Atención</span>Escribe el mismo correo con el que te registraste para acceder a la Clase</p>

    <form id="accessForm" novalidate>
      <div>
        <input type="email" id="emailInput" name="email" placeholder="tucorreo@ejemplo.com" required>
        <div class="error" id="errorMsg">Por favor ingresa un correo válido.</div>
      </div>
      <button type="submit">Continuar</button>
    </form>
  </div>

<script>
  const form = document.getElementById('accessForm');
  const emailInput = document.getElementById('emailInput');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!isValid) {
      errorMsg.classList.add('visible');
      emailInput.style.borderColor = '#B00020';
      return;
    }

    errorMsg.classList.remove('visible');
    emailInput.style.borderColor = '#111111';

    // Simulación local de "ya usó la clase de cortesía".
    // Para una validación real contra todos tus inscritos, esto debería
    // consultarse en un backend/Google Sheet en vez de localStorage.
    const key = 'clasesCortesiaUsadas';
    const usados = JSON.parse(localStorage.getItem(key) || '[]');
    const emailNormalizado = email.toLowerCase();
    const yaUso = usados.includes(emailNormalizado);

    if (!yaUso) {
      usados.push(emailNormalizado);
      localStorage.setItem(key, JSON.stringify(usados));
    }

    const status = yaUso ? 'repetido' : 'nuevo';
    window.location.href = 'bienvenida.html?status=' + status + '&email=' + encodeURIComponent(email);
  });

  emailInput.addEventListener('input', function () {
    errorMsg.classList.remove('visible');
    emailInput.style.borderColor = '#111111';
  });
</script>

</body>
</html>
